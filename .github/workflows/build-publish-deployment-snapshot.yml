name: Create aleo-devnet deployment snapshot

on:
  workflow_call:
    inputs:
      git-ref:
        description: 'Git commit SHA, branch, or tag to clone'
        required: false
        default: 'main'
        type: string
      aleo-devnet-version:
        description: 'Version tag for aleo-devnet base image'
        required: false
        default: 'v4.1.0-v4.7.0'
        type: string
      image-name:
        description: 'Custom image name (without registry)'
        required: false
        default: 'aleo-devnet-custom'
        type: string
      push-latest:
        description: 'Also tag and push as latest'
        required: false
        default: true
        type: boolean
      skip-push:
        description: 'Build images but skip pushing to registry'
        required: false
        default: false
        type: boolean
      consensus-version:
        description: 'Target consensus version for devnet (default: 15)'
        required: false
        default: 15
        type: number
      required-programs:
        description: 'Comma-separated program IDs to verify. Empty = read from required-programs.txt'
        required: false
        default: ''
        type: string
    secrets:
      registry_token:
        description: 'Token for container registry authentication'
        required: true

  workflow_dispatch:
    inputs:
      git-ref:
        description: 'Git commit SHA, branch, or tag to clone'
        required: false
        default: 'main'
        type: string
      aleo-devnet-version:
        description: 'Version tag for aleo-devnet base image'
        required: false
        default: 'v4.1.0-v4.7.0'
        type: string
      image-name:
        description: 'Custom image name (without registry)'
        required: false
        default: 'aleo-devnet-custom'
        type: string
      push-latest:
        description: 'Also tag and push as latest'
        required: false
        default: true
        type: boolean
      skip-push:
        description: 'Build images but skip pushing to registry'
        required: false
        default: false
        type: boolean
      consensus-version:
        description: 'Target consensus version for devnet (default: 15)'
        required: false
        default: 15
        type: number
      required-programs:
        description: 'Comma-separated program IDs to verify. Empty = read from required-programs.txt'
        required: false
        default: ''
        type: string

permissions: {}

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1 # enable docker buildkit
  TESTNET_ENDPOINT: "http://localhost:3030"

jobs:
  create-deployment-snapshot-image: # zizmor: ignore[secrets-outside-env]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read # checkout code
      packages: write # push images to registry
      actions: read # read workflow artifacts
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Parse Leo version from aleo-devnet-version
        id: parse-version
        env:
          INPUT_DEVNET_VERSION: ${{ inputs.aleo-devnet-version }}
        run: |
          # Extract Leo version from aleo-devnet-version (format: vX.Y.Z-vA.B.C)
          LEO_VERSION=$(echo "${INPUT_DEVNET_VERSION}" | cut -d'-' -f1 | sed 's/^v//')
          echo "leo-version=${LEO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Parsed Leo version: ${LEO_VERSION}"

      - name: Validate aleo-devnet version
        env:
          INPUT_DEVNET_VERSION: ${{ inputs.aleo-devnet-version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_DEVNET_VERSION}"
          MIN_LEO="3.5.0"
          MIN_SNARKOS="4.5.3"

          # Extract Leo and snarkOS versions from format vX.Y.Z-vA.B.C
          if [[ "$VERSION" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            LEO_VER="${BASH_REMATCH[1]}"
            SNARKOS_VER="${BASH_REMATCH[2]}"

            if [[ "$(printf '%s\n%s' "$MIN_LEO" "$LEO_VER" | sort -V | head -n1)" != "$MIN_LEO" ]]; then
              echo "::error::Leo version v${LEO_VER} is below minimum v${MIN_LEO}. Pre-migration base images lack the rootless 'leo' user and /aleo/data layout."
              exit 1
            fi
            if [[ "$(printf '%s\n%s' "$MIN_SNARKOS" "$SNARKOS_VER" | sort -V | head -n1)" != "$MIN_SNARKOS" ]]; then
              echo "::error::snarkOS version v${SNARKOS_VER} is below minimum v${MIN_SNARKOS}. Pre-migration base images lack the rootless 'leo' user and /aleo/data layout."
              exit 1
            fi
            echo "Version validation passed: Leo v${LEO_VER} >= v${MIN_LEO}, snarkOS v${SNARKOS_VER} >= v${MIN_SNARKOS}"
          else
            echo "::warning::Version '${VERSION}' does not match expected format vX.Y.Z-vA.B.C. Cannot validate against minimum requirements."
          fi

      - name: Setup Leo CLI
        id: setup-leo
        # PR #19 head: Support Leo 4.1.0 source tags. Replace with a release SHA once published.
        uses: sealance-io/setup-leo-action@1a751b63289e0475d09058db0cbc18e88abc7048 # PR #19 head
        with:
          version: ${{ steps.parse-version.outputs.leo-version }}
          rust-version: '1.96.0'
          enable-cache: true
          cache-save: ${{ github.ref == 'refs/heads/main' && 'always' || 'never' }}
          run-audit: true
          audit-deny-warnings: false

      - name: Verify Leo installation
        env:
          CACHE_HIT_BINARY: ${{ steps.setup-leo.outputs.cache-hit-binary }}
          BUILD_TIME_SECONDS: ${{ steps.setup-leo.outputs.build-time-seconds }}
        run: |
          leo --version
          echo "Cache hit (binary): ${CACHE_HIT_BINARY}"
          echo "Build time: ${BUILD_TIME_SECONDS}s"

      - name: Set up QEMU (cross-platform emulation)
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.event_name == 'workflow_dispatch' && secrets.GITHUB_TOKEN || secrets.registry_token }}

      - name: Clone target repository
        env:
          INPUT_GIT_REF: ${{ inputs.git-ref }}
        run: |
          set -euo pipefail
          echo "Cloning repository with ref: ${INPUT_GIT_REF}"
          git clone --depth 1 --branch "${INPUT_GIT_REF}" \
            https://github.com/sealance-io/compliant-transfer-aleo.git \
            compliant-transfer-aleo-build 2>/dev/null || {
            # If branch clone fails, try as a commit/tag
            git clone https://github.com/sealance-io/compliant-transfer-aleo.git \
              compliant-transfer-aleo-build
            cd compliant-transfer-aleo-build
            git checkout "${INPUT_GIT_REF}"
            cd ..
          }

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: 'compliant-transfer-aleo-build/.nvmrc'
          cache-dependency-path: compliant-transfer-aleo-build/package-lock.json
          cache: 'npm' # zizmor: ignore[cache-poisoning] -- no PR trigger; workflow_dispatch/workflow_call only

      - name: Install dokojs CLI
        run: |
          npm install -g @sealance-io/dokojs@1.0.8 --registry=https://registry.npmjs.org/ --ignore-scripts
          dokojs --version

      - name: Create data directory
        shell: bash
        working-directory: compliant-transfer-aleo-build
        run: |
          set -euo pipefail
          echo "[BUILD] Creating devnet directory in $(pwd)..."
          mkdir -p devnet
          echo "[SUCCESS] Created devnet directory: $(pwd)/devnet"

      - name: Prepare deployment environment
        working-directory: compliant-transfer-aleo-build
        env:
          TESTNET_ENDPOINT: 'https://api.explorer.provable.com/v1'
        run: |
          set -euo pipefail
          # Copy environment file
          cp .env.example .env

          # Install dependencies
          npm ci --ignore-scripts

          # Apply package patches
          npm run postinstall

          # build @sealance-io/policy-engine-aleo
          npm run build --workspace=@sealance-io/policy-engine-aleo

          # Compile leo programs
          npm run compile

      - name: Bootstrap aleo-devnet
        working-directory: compliant-transfer-aleo-build
        env:
          INPUT_CONSENSUS_VERSION: ${{ inputs.consensus-version }}
          INPUT_DEVNET_VERSION: ${{ inputs.aleo-devnet-version }}
        run: |
          set -euo pipefail

          # Generate consensus version heights (0 to consensus-version - 1)
          CONSENSUS_VERSION=${INPUT_CONSENSUS_VERSION}
          CONSENSUS_HEIGHTS=$(seq 0 $((CONSENSUS_VERSION - 1)) | tr '\n' ',' | sed 's/,$//')
          echo "[BUILD] Using consensus heights: ${CONSENSUS_HEIGHTS}"

          docker pull "ghcr.io/sealance-io/aleo-devnet:${INPUT_DEVNET_VERSION}"
          docker volume create aleo_devnet_state_volume
          # Explicit devnet args work with both wrapper (passthrough) and pre-wrapper (direct leo) base images.
          # --snarkos-features test_network is required for CONSENSUS_VERSION_HEIGHTS support.
          docker run -d \
            --name devnet \
            -p 3030:3030 \
            -v aleo_devnet_state_volume:/aleo/data \
            -e CONSENSUS_VERSION_HEIGHTS="${CONSENSUS_HEIGHTS}" \
            "ghcr.io/sealance-io/aleo-devnet:${INPUT_DEVNET_VERSION}" \
            devnet --storage /aleo/data --clear-storage --yes --verbosity 4 \
            --snarkos ./snarkos --num-clients 1 --snarkos-features test_network

      - name: Wait for devnet to reach consensus version
        env:
          INPUT_CONSENSUS_VERSION: ${{ inputs.consensus-version }}
        run: |
          set -euo pipefail
          TARGET_CONSENSUS=${INPUT_CONSENSUS_VERSION}
          echo "[BUILD] Waiting for devnet to reach consensus version >= ${TARGET_CONSENSUS}..."
          RETRY_COUNT=0
          MAX_RETRIES=100
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            CONSENSUS_VERSION=$(curl -s "${TESTNET_ENDPOINT}/testnet/consensus_version" 2>/dev/null || echo "")
            if [ -n "$CONSENSUS_VERSION" ] && [ "$CONSENSUS_VERSION" -ge "$TARGET_CONSENSUS" ] 2>/dev/null; then
              echo "[SUCCESS] Devnet consensus version is $CONSENSUS_VERSION (>= ${TARGET_CONSENSUS})."
              break
            fi
            if [ -z "$CONSENSUS_VERSION" ]; then
              echo "[BUILD] Waiting for consensus version response... (attempt $((RETRY_COUNT + 1))/$MAX_RETRIES)"
            else
              echo "[BUILD] Current consensus version: $CONSENSUS_VERSION, waiting for >= ${TARGET_CONSENSUS}... (attempt $((RETRY_COUNT + 1))/$MAX_RETRIES)"
            fi
            sleep 5
            RETRY_COUNT=$((RETRY_COUNT + 1))
          done

          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "[ERROR] Devnet did not reach consensus version >= ${TARGET_CONSENSUS} after ${MAX_RETRIES} attempts."
            echo "[WARNING] Container logs:"
            docker logs devnet --tail 200 || true
            exit 1
          fi

      - name: Resolve required programs
        id: programs
        env:
          INPUT_REQUIRED_PROGRAMS: ${{ inputs.required-programs }}
          INPUT_SKIP_PUSH: ${{ inputs.skip-push }}
        run: |
          set -euo pipefail
          PROGRAMS="${INPUT_REQUIRED_PROGRAMS}"
          if [[ -z "$PROGRAMS" ]]; then
            if [[ -f "required-programs.txt" ]]; then
              PROGRAMS=$(grep -Ev '^[[:space:]]*#|^[[:space:]]*$' required-programs.txt | tr '\n' ',' | sed 's/,$//')
              echo "Resolved from required-programs.txt: ${PROGRAMS}"
            fi
          else
            echo "Using input override: ${PROGRAMS}"
          fi

          # Fail closed: publish flows require a non-empty program list
          if [[ "${INPUT_SKIP_PUSH}" != "true" && -z "$PROGRAMS" ]]; then
            echo "::error::No required programs resolved (required-programs.txt missing/empty and required-programs input not set). Cannot publish without verification."
            exit 1
          fi
          if [[ "${INPUT_SKIP_PUSH}" == "true" && -z "$PROGRAMS" ]]; then
            echo "::warning::No required programs resolved. Program verification will be skipped (skip-push mode)."
          fi
          echo "list=${PROGRAMS}" >> "$GITHUB_OUTPUT"

      - name: Deploy programs
        working-directory: compliant-transfer-aleo-build
        run: |
          set -euo pipefail
          npm run deploy:devnet

      - name: Verify deployed programs
        if: ${{ steps.programs.outputs.list != '' }}
        env:
          PROGRAMS_LIST: ${{ steps.programs.outputs.list }}
        run: |
          set -euo pipefail
          IFS=',' read -ra PROGRAMS <<< "${PROGRAMS_LIST}"
          MAX_RETRIES=10
          RETRY_DELAY=3
          ALL_OK=true

          for program in "${PROGRAMS[@]}"; do
            program=$(echo "$program" | xargs)
            [[ -z "$program" ]] && continue
            FOUND=false
            for ((attempt=1; attempt<=MAX_RETRIES; attempt++)); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${TESTNET_ENDPOINT}/testnet/program/${program}" 2>/dev/null || echo "000")
              if [[ "$HTTP_CODE" == "200" ]]; then
                echo "[SUCCESS] Program '${program}' verified (HTTP ${HTTP_CODE})."
                FOUND=true
                break
              fi
              echo "[WARNING] Program '${program}' not found (HTTP ${HTTP_CODE}), retrying (${attempt}/${MAX_RETRIES})..."
              sleep $RETRY_DELAY
            done
            if [[ "$FOUND" != "true" ]]; then
              echo "::error::Program '${program}' NOT found after ${MAX_RETRIES} attempts."
              ALL_OK=false
            fi
          done

          if [[ "$ALL_OK" != "true" ]]; then
            echo "::error::Program verification failed. Aborting snapshot build."
            exit 1
          fi
          echo "[SUCCESS] All required programs verified."

      - name: Stop container and extract state
        working-directory: compliant-transfer-aleo-build
        run: |
          set -euo pipefail
          # Gracefully stop container
          echo "[BUILD] Stopping container devnet gracefully..."
          docker stop --timeout=30 devnet
          echo "[SUCCESS] Container stopped."

          # Additional wait to ensure everything is flushed
          echo "[BUILD] Waiting for complete shutdown..."
          sleep 30

          # Copy only blockchain data from container
          echo "[BUILD] Copying state from container to host..."
          mkdir -p ./devnet/data
          docker cp devnet:/aleo/data/. ./devnet/data/
          echo "[SUCCESS] State copied to $(pwd)/devnet/data"

          # Cleanup container and volume
          echo "[BUILD] Removing container devnet..."
          docker rm devnet || true
          echo "[BUILD] Removing volume aleo_devnet_state_volume..."
          docker volume rm aleo_devnet_state_volume || true
          echo "[SUCCESS] Container and volume removed."

      - name: Validate remaining prerequisites
        shell: bash
        working-directory: compliant-transfer-aleo-build
        run: |
          set -euo pipefail

          echo "[BUILD] Current directory: $(pwd)"
          echo "[BUILD] Checking for devnet/data directory..."

          # Check if ./devnet/data directory exists and has content
          if [ ! -d "./devnet/data" ]; then
              echo "[ERROR] ./devnet/data directory not found."
              exit 1
          fi

          echo "[BUILD] devnet/data directory found. Checking contents..."
          ls -la ./devnet/data

          # Final validation - check if directory has content
          if [ -z "$(ls -A ./devnet/data)" ]; then
              echo "[ERROR] ./devnet/data directory is empty. Deployment may have failed."
              exit 1
          fi

          echo "[SUCCESS] Files in ./devnet/data directory (including hidden files):"
          ls -la ./devnet/data

      - name: Generate Dockerfile
        working-directory: compliant-transfer-aleo-build
        run: |
          set -euo pipefail
          cat > Dockerfile << 'EOF'
          # syntax=docker/dockerfile:1.4
          ARG DEVNET_VERSION
          FROM ghcr.io/sealance-io/aleo-devnet:${DEVNET_VERSION}

          # Metadata
          LABEL org.opencontainers.image.source="https://github.com/sealance-io/compliant-transfer-aleo"
          LABEL org.opencontainers.image.description="Aleo devnet node with pre-deployed contracts"
          LABEL org.opencontainers.image.authors="Sealance.io"

          # Copy blockchain state with deployed contracts
          COPY --chown=leo:leo ./devnet/data /aleo/data
          EOF

      - name: Extract metadata
        id: meta
        working-directory: compliant-transfer-aleo-build
        env:
          INPUT_DEVNET_VERSION: ${{ inputs.aleo-devnet-version }}
          INPUT_IMAGE_NAME: ${{ inputs.image-name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Get git commit info
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          FULL_SHA=$(git rev-parse HEAD)

          # Generate version tag
          VERSION_TAG="${INPUT_DEVNET_VERSION}-${SHORT_SHA}"

          # Set outputs
          {
            echo "short-sha=${SHORT_SHA}"
            echo "full-sha=${FULL_SHA}"
            echo "version-tag=${VERSION_TAG}"
            echo "image-name=${REGISTRY}/${REPO_OWNER}/${INPUT_IMAGE_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-platform image (version tag only)
        if: ${{ !inputs.skip-push }}
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: compliant-transfer-aleo-build
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DEVNET_VERSION=${{ inputs.aleo-devnet-version }}
          tags: |
            ${{ steps.meta.outputs.image-name }}:${{ steps.meta.outputs.version-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Aleo Devnet Custom
            org.opencontainers.image.description=Aleo devnet node with pre-deployed contracts
            org.opencontainers.image.source=https://github.com/sealance-io/compliant-transfer-aleo
            org.opencontainers.image.version=${{ steps.meta.outputs.version-tag }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.full-sha }}
            org.opencontainers.image.base.name=ghcr.io/sealance-io/aleo-devnet:${{ inputs.aleo-devnet-version }}

      - name: Build multi-platform image (local only, version tag)
        if: ${{ inputs.skip-push }}
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: compliant-transfer-aleo-build
          platforms: linux/amd64
          push: false
          build-args: |
            DEVNET_VERSION=${{ inputs.aleo-devnet-version }}
          tags: |
            ${{ steps.meta.outputs.image-name }}:${{ steps.meta.outputs.version-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/image.tar
          labels: |
            org.opencontainers.image.title=Aleo Devnet Custom
            org.opencontainers.image.description=Aleo devnet node with pre-deployed contracts
            org.opencontainers.image.source=https://github.com/sealance-io/compliant-transfer-aleo
            org.opencontainers.image.version=${{ steps.meta.outputs.version-tag }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.full-sha }}
            org.opencontainers.image.base.name=ghcr.io/sealance-io/aleo-devnet:${{ inputs.aleo-devnet-version }}

      - name: Load image (skip-push mode)
        if: ${{ inputs.skip-push }}
        run: |
          docker load -i /tmp/image.tar

      - name: Post-build verification
        if: ${{ steps.programs.outputs.list != '' }}
        env:
          META_IMAGE_NAME: ${{ steps.meta.outputs.image-name }}
          META_VERSION_TAG: ${{ steps.meta.outputs.version-tag }}
          INPUT_SKIP_PUSH: ${{ inputs.skip-push }}
          PROGRAMS_LIST: ${{ steps.programs.outputs.list }}
        run: |
          set -euo pipefail
          IMAGE="${META_IMAGE_NAME}:${META_VERSION_TAG}"

          # Full runtime E2E only runs on the native amd64 path. In publish mode,
          # verify arm64 via manifest inspection to avoid slow/flaky QEMU boot on
          # GitHub-hosted x86 runners.
          if [[ "${INPUT_SKIP_PUSH}" == "true" ]]; then
            RUNTIME_PLATFORMS=("linux/amd64")
            MANIFEST_PLATFORMS=()
          else
            RUNTIME_PLATFORMS=("linux/amd64")
            MANIFEST_PLATFORMS=("linux/arm64")
          fi

          for PLAT in "${RUNTIME_PLATFORMS[@]}"; do
            # Pull the specific platform variant (push mode only; skip-push already loaded)
            if [[ "${INPUT_SKIP_PUSH}" != "true" ]]; then
              echo "[BUILD] Pulling ${PLAT} image for E2E verification..."
              docker pull --platform "${PLAT}" "$IMAGE"
            fi
            echo "::group::E2E verification for ${PLAT}"
            TEST_CONTAINER="snapshot-verify-${PLAT//\//-}-$$"
            PORT=13030

            cleanup_verify() {
              echo "[BUILD] Cleaning up verification container ${TEST_CONTAINER}..."
              docker stop --time=5 "$TEST_CONTAINER" &>/dev/null || true
              docker rm "$TEST_CONTAINER" &>/dev/null || true
            }
            trap cleanup_verify EXIT

            echo "[BUILD] Starting snapshot image for E2E verification (${PLAT})..."
            docker run -d \
              --name "$TEST_CONTAINER" \
              --platform "${PLAT}" \
              -p ${PORT}:3030 \
              -e CLEAR_STORAGE=no \
              "$IMAGE"

            # Wait for REST API readiness
            TIMEOUT=360
            ELAPSED=0
            echo "[BUILD] Waiting up to ${TIMEOUT}s for REST API on port ${PORT}..."
            while [[ $ELAPSED -lt $TIMEOUT ]]; do
              if curl -s "http://localhost:${PORT}/testnet/latest/height" &>/dev/null; then
                echo "[SUCCESS] REST API is ready (after ${ELAPSED}s)."
                break
              fi
              sleep 5
              ELAPSED=$((ELAPSED + 5))
            done

            if [[ $ELAPSED -ge $TIMEOUT ]]; then
              echo "::error::REST API did not become ready within ${TIMEOUT}s (${PLAT})."
              docker logs "$TEST_CONTAINER" --tail 50 || true
              cleanup_verify
              exit 1
            fi

            # Verify programs (with retries, same as pre-shutdown check)
            IFS=',' read -ra PROGRAMS <<< "${PROGRAMS_LIST}"
            MAX_RETRIES=10
            RETRY_DELAY=3
            ALL_OK=true
            for program in "${PROGRAMS[@]}"; do
              program=$(echo "$program" | xargs)
              [[ -z "$program" ]] && continue
              FOUND=false
              for ((attempt=1; attempt<=MAX_RETRIES; attempt++)); do
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${PORT}/testnet/program/${program}" 2>/dev/null || echo "000")
                if [[ "$HTTP_CODE" == "200" ]]; then
                  echo "[SUCCESS] E2E (${PLAT}): Program '${program}' verified."
                  FOUND=true
                  break
                fi
                echo "[WARNING] E2E (${PLAT}): Program '${program}' not found (HTTP ${HTTP_CODE}), retrying (${attempt}/${MAX_RETRIES})..."
                sleep $RETRY_DELAY
              done
              if [[ "$FOUND" != "true" ]]; then
                echo "::error::E2E (${PLAT}): Program '${program}' NOT found after ${MAX_RETRIES} attempts."
                ALL_OK=false
              fi
            done

            cleanup_verify
            trap - EXIT

            if [[ "$ALL_OK" != "true" ]]; then
              echo "::error::Post-build E2E verification failed for ${PLAT}."
              exit 1
            fi
            echo "[SUCCESS] Post-build E2E verification passed for ${PLAT}."
            echo "::endgroup::"
          done

          for PLAT in "${MANIFEST_PLATFORMS[@]}"; do
            echo "::group::Manifest inspection for ${PLAT}"
            echo "[BUILD] Inspecting pushed manifest list for ${PLAT}..."
            PLAT_OS="${PLAT%%/*}"
            PLAT_ARCH="${PLAT##*/}"
            if ! MANIFEST_JSON="$(docker manifest inspect "$IMAGE" | tr -d '\n[:space:]')"; then
              echo "::error::Failed to inspect manifest list for ${IMAGE}."
              exit 1
            fi

            if [[ "$MANIFEST_JSON" != *'"platform":{"architecture":"'"${PLAT_ARCH}"'","os":"'"${PLAT_OS}"'"'* ]] && \
               [[ "$MANIFEST_JSON" != *'"platform":{"os":"'"${PLAT_OS}"'","architecture":"'"${PLAT_ARCH}"'"'* ]]; then
              echo "::error::Manifest list for ${IMAGE} does not include ${PLAT}."
              exit 1
            fi

            echo "[SUCCESS] Manifest list includes ${PLAT}."
            echo "::endgroup::"
          done

      - name: Retag verified image as latest
        if: ${{ inputs.push-latest && !inputs.skip-push }}
        env:
          META_IMAGE_NAME: ${{ steps.meta.outputs.image-name }}
          META_VERSION_TAG: ${{ steps.meta.outputs.version-tag }}
        run: |
          docker buildx imagetools create \
            --tag "${META_IMAGE_NAME}:latest" \
            "${META_IMAGE_NAME}:${META_VERSION_TAG}"

      - name: Tag latest locally (skip-push mode)
        if: ${{ inputs.push-latest && inputs.skip-push }}
        env:
          META_IMAGE_NAME: ${{ steps.meta.outputs.image-name }}
          META_VERSION_TAG: ${{ steps.meta.outputs.version-tag }}
        run: |
          docker tag \
            "${META_IMAGE_NAME}:${META_VERSION_TAG}" \
            "${META_IMAGE_NAME}:latest"

      - name: Generate summary
        env:
          TRIGGER_TEXT: ${{ github.event_name == 'workflow_dispatch' && 'Manual dispatch' || 'Workflow call' }}
          GH_ACTOR: ${{ github.actor }}
          INPUT_DEVNET_VERSION: ${{ inputs.aleo-devnet-version }}
          INPUT_GIT_REF: ${{ inputs.git-ref }}
          META_FULL_SHA: ${{ steps.meta.outputs.full-sha }}
          HEADER_TEXT: ${{ inputs.skip-push && 'Built Images (not pushed)' || 'Published Images' }}
          META_IMAGE_NAME: ${{ steps.meta.outputs.image-name }}
          META_VERSION_TAG: ${{ steps.meta.outputs.version-tag }}
          LATEST_LINE: ${{ inputs.push-latest == 'true' && !inputs.skip-push && format('- `{0}:latest`', steps.meta.outputs.image-name) || '' }}
          SKIP_PUSH_COMMENT: ${{ inputs.skip-push && '# Image built locally only (not pushed to registry)' || '' }}
          PULL_COMMAND: ${{ !inputs.skip-push && format('docker pull {0}:{1}', steps.meta.outputs.image-name, steps.meta.outputs.version-tag) || '' }}
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          # Build Summary

          ## 🚀 Custom Aleo Devnet Chain Image Built Successfully!

          ### Build Information
          - **Triggered by**: ${TRIGGER_TEXT}
          - **Actor**: @${GH_ACTOR}

          ### Image Details
          - **Base Version**: \`${INPUT_DEVNET_VERSION}\`
          - **Git Reference**: \`${INPUT_GIT_REF}\`
          - **Git SHA**: \`${META_FULL_SHA}\`

          ### ${HEADER_TEXT}
          - \`${META_IMAGE_NAME}:${META_VERSION_TAG}\`
          ${LATEST_LINE}

          ### Platforms
          - ✅ linux/amd64 (x86_64)
          - ✅ linux/arm64 (ARM64/Apple Silicon)

          ### Usage
          \`\`\`bash
          ${SKIP_PUSH_COMMENT}
          ${PULL_COMMAND}
          docker run -p 3030:3030 ${META_IMAGE_NAME}:${META_VERSION_TAG}
          \`\`\`
          EOF
