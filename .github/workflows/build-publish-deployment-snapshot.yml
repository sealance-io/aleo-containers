name: Create aleo-devnet deployment snapshot

on:
  workflow_call:
    inputs:
      git-ref:
        description: 'Git commit SHA, branch, or tag to clone'
        required: false
        default: 'main'
        type: string
      aleo-devnet-version:
        description: 'Version tag for aleo-devnet base image'
        required: false
        default: 'v3.4.0-v4.4.0'
        type: string
      image-name:
        description: 'Custom image name (without registry)'
        required: false
        default: 'aleo-devnet-custom'
        type: string
      push-latest:
        description: 'Also tag and push as latest'
        required: false
        default: true
        type: boolean
      skip-push:
        description: 'Build images but skip pushing to registry'
        required: false
        default: false
        type: boolean
      consensus-version:
        description: 'Target consensus version for devnet (default: 12)'
        required: false
        default: 12
        type: number
    secrets:
      registry_token:
        description: 'Token for container registry authentication'
        required: true
  
  workflow_dispatch:
    inputs:
      git-ref:
        description: 'Git commit SHA, branch, or tag to clone'
        required: false
        default: 'main'
        type: string
      aleo-devnet-version:
        description: 'Version tag for aleo-devnet base image'
        required: false
        default: 'v3.4.0-v4.4.0'
        type: string
      image-name:
        description: 'Custom image name (without registry)'
        required: false
        default: 'aleo-devnet-custom'
        type: string
      push-latest:
        description: 'Also tag and push as latest'
        required: false
        default: true
        type: boolean
      skip-push:
        description: 'Build images but skip pushing to registry'
        required: false
        default: false
        type: boolean
      consensus-version:
        description: 'Target consensus version for devnet (default: 12)'
        required: false
        default: 12
        type: number

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1 # enable docker buildkit
  DOCKER_HOST: "unix:///var/run/docker.sock"
  TESTNET_ENDPOINT: "http://host.docker.internal:3030"

jobs:
  create-deployment-snapshot-image:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash 
    permissions:
      contents: read
      packages: write
      actions: read
    timeout-minutes: 180
    container:
      image: ghcr.io/sealance-io/leo-lang-ci:v3.4.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
      options: --cpus 2 --add-host=host.docker.internal:host-gateway
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.event_name == 'workflow_dispatch' && secrets.GITHUB_TOKEN || secrets.registry_token }}

      - name: Clone target repository
        run: |
          set -euo pipefail
          echo "Cloning repository with ref: ${{ inputs.git-ref }}"
          git clone --depth 1 --branch "${{ inputs.git-ref }}" \
            https://github.com/sealance-io/compliant-transfer-aleo.git \
            compliant-transfer-aleo-build 2>/dev/null || {
            # If branch clone fails, try as a commit/tag
            git clone https://github.com/sealance-io/compliant-transfer-aleo.git \
              compliant-transfer-aleo-build
            cd compliant-transfer-aleo-build
            git checkout "${{ inputs.git-ref }}"
            cd ..
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'compliant-transfer-aleo-build/.nvmrc'
          cache-dependency-path: compliant-transfer-aleo-build/package-lock.json
          cache: 'npm'

      - name: Install dokojs CLI
        run: |
          npm config set @sealance-io:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}
          npm install -g @sealance-io/dokojs@1.0.0 --ignore-scripts
          dokojs --version

      - name: Create data directory
        shell: bash
        working-directory: compliant-transfer-aleo-build
        run: |
          set -euo pipefail
          echo "[BUILD] Creating devnet directory in $(pwd)..."
          mkdir -p devnet
          echo "[SUCCESS] Created devnet directory: $(pwd)/devnet"

      - name: Prepare deployment environment
        working-directory: compliant-transfer-aleo-build
        env:
          TESTNET_ENDPOINT: 'https://api.explorer.provable.com/v1'
        run: |
          set -euo pipefail
          # Copy environment file
          cp .env.example .env

          # Install dependencies
          npm ci

          # Apply package patches
          npm run postinstall

          # build @sealance-io/policy-engine-aleo
          npm run build --workspace=@sealance-io/policy-engine-aleo

          # Compile leo programs
          npm run compile

      - name: Bootstrap aleo-devnet
        working-directory: compliant-transfer-aleo-build
        run: |
          set -euo pipefail

          # Generate consensus version heights (0 to consensus-version - 1)
          CONSENSUS_VERSION=${{ inputs.consensus-version }}
          CONSENSUS_HEIGHTS=$(seq -s ',' 0 $((CONSENSUS_VERSION - 1)))
          echo "[BUILD] Using consensus heights: ${CONSENSUS_HEIGHTS}"

          docker pull ghcr.io/sealance-io/aleo-devnet:${{ inputs.aleo-devnet-version }}
          docker volume create aleo_devnet_state_volume
          docker run -d \
            --name devnet \
            -p 3030:3030 \
            -v aleo_devnet_state_volume:/aleo \
            -e CONSENSUS_VERSION_HEIGHTS="${CONSENSUS_HEIGHTS}" \
            ghcr.io/sealance-io/aleo-devnet:${{ inputs.aleo-devnet-version }}

      - name: Wait for devnet to reach consensus version
        run: |
          set -euo pipefail
          TARGET_CONSENSUS=${{ inputs.consensus-version }}
          echo "[BUILD] Waiting for devnet to reach consensus version >= ${TARGET_CONSENSUS}..."
          RETRY_COUNT=0
          MAX_RETRIES=100
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            CONSENSUS_VERSION=$(curl -s "${{ env.TESTNET_ENDPOINT }}/testnet/consensus_version" 2>/dev/null || echo "")
            if [ -n "$CONSENSUS_VERSION" ] && [ "$CONSENSUS_VERSION" -ge "$TARGET_CONSENSUS" ] 2>/dev/null; then
              echo "[SUCCESS] Devnet consensus version is $CONSENSUS_VERSION (>= ${TARGET_CONSENSUS})."
              break
            fi
            if [ -z "$CONSENSUS_VERSION" ]; then
              echo "[BUILD] Waiting for consensus version response... (attempt $((RETRY_COUNT + 1))/$MAX_RETRIES)"
            else
              echo "[BUILD] Current consensus version: $CONSENSUS_VERSION, waiting for >= ${TARGET_CONSENSUS}... (attempt $((RETRY_COUNT + 1))/$MAX_RETRIES)"
            fi
            sleep 5
            RETRY_COUNT=$((RETRY_COUNT + 1))
          done

          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "[ERROR] Devnet did not reach consensus version >= ${TARGET_CONSENSUS} after ${MAX_RETRIES} attempts."
            echo "[WARNING] Container logs:"
            docker logs devnet --tail 50 || true
            exit 1
          fi

      - name: Run deployment and extract state
        working-directory: compliant-transfer-aleo-build
        run: |
          set -euo pipefail
          # Deploy programs to local devnet
          npm run deploy:devnet

          # Step 5: Gracefully stop container
          echo "[BUILD] Stopping container devnet gracefully..."
          docker stop --timeout=30 devnet
          echo "[SUCCESS] Container stopped."

          # Additional wait to ensure everything is flushed
          echo "[BUILD] Waiting for complete shutdown..."
          sleep 30

          # Step 6: Copy state from container to host using docker cp
          # Note: Using docker cp instead of volume bind mount to avoid DinD path issues
          echo "[BUILD] Copying state from container to host..."
          docker cp devnet:/aleo/. ./devnet/
          echo "[SUCCESS] State copied to $(pwd)/devnet"

          # Step 7: Cleanup container and volume
          echo "[BUILD] Removing container devnet..."
          docker rm devnet || true
          echo "[BUILD] Removing volume aleo_devnet_state_volume..."
          docker volume rm aleo_devnet_state_volume || true
          echo "[SUCCESS] Container and volume removed."

      - name: Validate remaining prerequisites
        shell: bash
        working-directory: compliant-transfer-aleo-build
        run: |
          set -euo pipefail
          
          echo "[BUILD] Current directory: $(pwd)"
          echo "[BUILD] Listing contents of current directory:"
          ls -la .
          echo "[BUILD] Checking for devnet directory..."
          
          # Check if ./devnet directory exists and has content
          if [ ! -d "./devnet" ]; then
              echo "[ERROR] ./devnet directory not found. This should have been created by the deployment process."
              exit 1
          fi
          
          echo "[BUILD] devnet directory found. Checking contents..."
          ls -la ./devnet
          
          # Remove snarkos binary if it exists (as per script)
          rm -rf ./devnet/snarkos

          # Final validation - check if directory has content after cleanup
          if [ -z "$(ls -A ./devnet)" ]; then
              echo "[ERROR] ./devnet directory is empty. Deployment may have failed."
              echo "[DEBUG] Volume copy may have failed or deployment didn't create state."
              exit 1
          fi
          
          echo "[SUCCESS] Files in ./devnet directory (including hidden files):"
          ls -la ./devnet
      
      - name: Generate Dockerfile
        working-directory: compliant-transfer-aleo-build
        run: |
          set -euo pipefail
          cat > Dockerfile << 'EOF'
          # syntax=docker/dockerfile:1.4
          ARG DEVNET_VERSION
          FROM ghcr.io/sealance-io/aleo-devnet:${DEVNET_VERSION}

          # Metadata
          LABEL org.opencontainers.image.source="https://github.com/sealance-io/compliant-transfer-aleo"
          LABEL org.opencontainers.image.description="Aleo devnet node with pre-deployed contracts"
          LABEL org.opencontainers.image.authors="Sealance.io"

          # Copy blockchain state with deployed contracts
          COPY ./devnet /aleo

          # Set the entrypoint to run the node
          ENTRYPOINT ["/usr/local/bin/leo"]
          CMD ["devnet", "--storage", "/data", "--yes", "--verbosity", "4", "--snarkos", "./snarkos", "--num-clients", "1"]
          EOF
      
      - name: Extract metadata
        id: meta
        working-directory: compliant-transfer-aleo-build
        run: |
          set -euo pipefail
          # Get git commit info
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          FULL_SHA=$(git rev-parse HEAD)
          
          # Generate version tag
          VERSION_TAG="${{ inputs.aleo-devnet-version }}-${SHORT_SHA}"
          
          # Set outputs
          echo "short-sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "full-sha=${FULL_SHA}" >> $GITHUB_OUTPUT
          echo "version-tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "image-name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ inputs.image-name }}" >> $GITHUB_OUTPUT
      
      - name: Build and push multi-platform image
        if: ${{ !inputs.skip-push }}
        uses: docker/build-push-action@v5
        with:
          context: compliant-transfer-aleo-build
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            DEVNET_VERSION=${{ inputs.aleo-devnet-version }}
          tags: |
            ${{ steps.meta.outputs.image-name }}:${{ steps.meta.outputs.version-tag }}
            ${{ inputs.push-latest == 'true' && format('{0}:latest', steps.meta.outputs.image-name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Aleo Devnet Custom
            org.opencontainers.image.description=Aleo devnet node with pre-deployed contracts
            org.opencontainers.image.source=https://github.com/sealance-io/compliant-transfer-aleo
            org.opencontainers.image.version=${{ steps.meta.outputs.version-tag }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.full-sha }}
            org.opencontainers.image.base.name=ghcr.io/sealance-io/aleo-devnet:${{ inputs.aleo-devnet-version }}
      
      - name: Build multi-platform image (local only)
        if: ${{ inputs.skip-push }}
        uses: docker/build-push-action@v5
        with:
          context: compliant-transfer-aleo-build
          platforms: linux/amd64
          push: false
          build-args: |
            DEVNET_VERSION=${{ inputs.aleo-devnet-version }}
          tags: |
            ${{ steps.meta.outputs.image-name }}:${{ steps.meta.outputs.version-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=oci,dest=/tmp/image.tar
          labels: |
            org.opencontainers.image.title=Aleo Devnet Custom
            org.opencontainers.image.description=Aleo devnet node with pre-deployed contracts
            org.opencontainers.image.source=https://github.com/sealance-io/compliant-transfer-aleo
            org.opencontainers.image.version=${{ steps.meta.outputs.version-tag }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.full-sha }}
            org.opencontainers.image.base.name=ghcr.io/sealance-io/aleo-devnet:${{ inputs.aleo-devnet-version }}
      
      - name: Generate summary
        run: |
          set -euo pipefail
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # Build Summary
          
          ## 🚀 Custom Aleo Devnet Chain Image Built Successfully!
          
          ### Build Information
          - **Triggered by**: ${{ github.event_name == 'workflow_dispatch' && 'Manual dispatch' || 'Workflow call' }}
          - **Actor**: @${{ github.actor }}
          
          ### Image Details
          - **Base Version**: \`${{ inputs.aleo-devnet-version }}\`
          - **Git Reference**: \`${{ inputs.git-ref }}\`
          - **Git SHA**: \`${{ steps.meta.outputs.full-sha }}\`
          
          ### ${{ inputs.skip-push && 'Built Images (not pushed)' || 'Published Images' }}
          - \`${{ steps.meta.outputs.image-name }}:${{ steps.meta.outputs.version-tag }}\`
          ${{ inputs.push-latest == 'true' && !inputs.skip-push && format('- `{0}:latest`', steps.meta.outputs.image-name) || '' }}
          
          ### Platforms
          - ✅ linux/amd64 (x86_64)
          - ✅ linux/arm64 (ARM64/Apple Silicon)
          
          ### Usage
          \`\`\`bash
          ${{ inputs.skip-push && '# Image built locally only (not pushed to registry)' || '' }}
          ${{ !inputs.skip-push && format('docker pull {0}:{1}', steps.meta.outputs.image-name, steps.meta.outputs.version-tag) || '' }}
          docker run -p 3030:3030 ${{ steps.meta.outputs.image-name }}:${{ steps.meta.outputs.version-tag }}
          \`\`\`
          EOF