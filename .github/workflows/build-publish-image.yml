name: Build and Publish Docker Images

# Reusable workflow - use manual-build.yml for workflow_dispatch
on:
  workflow_call:
    inputs:
      image_name:
        description: 'Name of the image to build (leo-lang or aleo-devnet)'
        required: true
        type: string
      dockerfile:
        description: 'Path to the Dockerfile'
        required: true
        type: string
      build_standard:
        description: 'Build standard image'
        required: false
        default: true
        type: boolean
      build_ci:
        description: 'Build CI image (only applicable for leo-lang)'
        required: false
        default: false
        type: boolean
      tag_latest:
        description: 'Tag as latest'
        required: false
        default: false
        type: boolean
      registry:
        description: 'Container registry'
        required: false
        default: 'ghcr.io'
        type: string
      organization:
        description: 'Organization in the registry'
        required: false
        default: 'sealance-io'
        type: string
      project_version:
        description: 'Project version to build (e.g., v3.4.0)'
        required: true
        type: string
      project_repo:
        description: 'Project repository URL'
        required: false
        type: string
      node_version:
        description: 'Node.js version for leo-lang'
        required: false
        default: '24'
        type: string
      debian_release:
        description: 'Debian release to use'
        required: false
        default: 'trixie'
        type: string
      snarkos_version:
        description: 'snarkOS version for aleo-devnet'
        required: false
        default: 'v4.4.0'
        type: string
      rust_version:
        description: 'Rust version for aleo-devnet'
        required: false
        default: '1.90.0'
        type: string
      leo_version:
        description: 'Leo version for aleo-devnet (if different from project_version)'
        required: false
        type: string
    secrets:
      registry_token:
        description: 'Token for container registry authentication'
        required: true

# Permissions required by callers
permissions:
  contents: read
  packages: write

jobs:
  determine-params:
    runs-on: ubuntu-latest
    outputs:
      project_repo: ${{ steps.set-params.outputs.project_repo }}
      project_repo_arg: ${{ steps.set-params.outputs.project_repo_arg }}
      project_version_arg: ${{ steps.set-params.outputs.project_version_arg }}
      uses_target: ${{ steps.set-params.outputs.uses_target }}
      registry_image: ${{ steps.set-params.outputs.registry_image }}
    steps:
      - name: Set project-specific parameters
        id: set-params
        run: |
          REGISTRY_IMAGE="${{ inputs.registry }}/${{ inputs.organization }}/${{ inputs.image_name }}"
          echo "registry_image=${REGISTRY_IMAGE}" >> $GITHUB_OUTPUT

          if [[ "${{ inputs.image_name }}" == "leo-lang" ]]; then
            echo "project_repo_arg=LEO_REPO" >> $GITHUB_OUTPUT
            echo "project_version_arg=LEO_VERSION" >> $GITHUB_OUTPUT
            echo "project_repo=${{ inputs.project_repo || 'https://github.com/ProvableHQ/leo' }}" >> $GITHUB_OUTPUT
            echo "uses_target=true" >> $GITHUB_OUTPUT
          elif [[ "${{ inputs.image_name }}" == "aleo-devnet" ]]; then
            echo "project_version_arg=LEO_VERSION" >> $GITHUB_OUTPUT
            echo "project_repo=" >> $GITHUB_OUTPUT
            echo "uses_target=false" >> $GITHUB_OUTPUT
          else
            echo "::error::Unknown image name: ${{ inputs.image_name }}"
            exit 1
          fi

  validate-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate CI image compatibility
        if: inputs.image_name == 'aleo-devnet' && inputs.build_ci
        run: |
          echo "::error::CI image is not available for aleo-devnet"
          exit 1

  # =============================================================================
  # STANDARD IMAGE BUILDS - Parallel per-architecture using native runners
  # =============================================================================
  build-standard:
    needs: [determine-params, validate-inputs]
    if: inputs.build_standard
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04 # Doesn't use ubuntu-latest for consistency
            platform_pair: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm # There's no ubuntu-latest-arm alias
            platform_pair: linux-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.registry_token }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.determine-params.outputs.registry_image }}
          tags: |
            type=raw,value=${{ inputs.project_version }}

      - name: Build and push by digest (Leo)
        if: inputs.image_name == 'leo-lang'
        id: build-leo
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          target: leo
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ needs.determine-params.outputs.project_version_arg }}=${{ inputs.project_version }}
            ${{ needs.determine-params.outputs.project_repo_arg }}=${{ needs.determine-params.outputs.project_repo }}
            NODE_VERSION=${{ inputs.node_version || '24' }}
            DEBIAN_RELEASE=${{ inputs.debian_release }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true,name=${{ needs.determine-params.outputs.registry_image }}
          cache-from: type=registry,ref=${{ needs.determine-params.outputs.registry_image }}:cache-${{ matrix.platform_pair }}
          cache-to: type=registry,ref=${{ needs.determine-params.outputs.registry_image }}:cache-${{ matrix.platform_pair }},mode=min

      - name: Build and push by digest (Aleo Devnet)
        if: inputs.image_name == 'aleo-devnet'
        id: build-devnet
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LEO_VERSION=${{ inputs.leo_version || 'v3.4.0' }}
            SNARKOS_VERSION=${{ inputs.snarkos_version || 'v4.4.0' }}
            RUST_VERSION=${{ inputs.rust_version || '1.90.0' }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true,name=${{ needs.determine-params.outputs.registry_image }}
          cache-from: type=registry,ref=${{ needs.determine-params.outputs.registry_image }}:cache-${{ matrix.platform_pair }}
          cache-to: type=registry,ref=${{ needs.determine-params.outputs.registry_image }}:cache-${{ matrix.platform_pair }},mode=min

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          # Get digest from whichever build step ran
          digest="${{ steps.build-leo.outputs.digest || steps.build-devnet.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-standard-${{ matrix.platform_pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # =============================================================================
  # MERGE STANDARD IMAGE - Creates multi-arch manifest from per-arch builds
  # =============================================================================
  merge-standard:
    needs: [determine-params, build-standard]
    if: inputs.build_standard
    runs-on: ubuntu-latest

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-standard-*
          merge-multiple: true

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.registry_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.determine-params.outputs.registry_image }}
          tags: |
            type=raw,value=${{ inputs.project_version }}
            type=raw,value=latest,enable=${{ inputs.tag_latest }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ needs.determine-params.outputs.registry_image }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ needs.determine-params.outputs.registry_image }}:${{ inputs.project_version }}

  # =============================================================================
  # CI IMAGE BUILDS - Parallel per-architecture using native runners (Leo only)
  # =============================================================================
  build-ci:
    needs: [determine-params, validate-inputs]
    if: inputs.build_ci && inputs.image_name == 'leo-lang'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04 # Doesn't use ubuntu-latest for consistency
            platform_pair: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            platform_pair: linux-arm64 # There's no ubuntu-latest-arm alias
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.registry_token }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.determine-params.outputs.registry_image }}-ci
          tags: |
            type=raw,value=${{ inputs.project_version }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          target: leo-ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ needs.determine-params.outputs.project_version_arg }}=${{ inputs.project_version }}
            ${{ needs.determine-params.outputs.project_repo_arg }}=${{ needs.determine-params.outputs.project_repo }}
            NODE_VERSION=${{ inputs.node_version || '24' }}
            DEBIAN_RELEASE=${{ inputs.debian_release }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true,name=${{ needs.determine-params.outputs.registry_image }}-ci
          cache-from: type=registry,ref=${{ needs.determine-params.outputs.registry_image }}-ci:cache-${{ matrix.platform_pair }}
          cache-to: type=registry,ref=${{ needs.determine-params.outputs.registry_image }}-ci:cache-${{ matrix.platform_pair }},mode=min

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-ci-${{ matrix.platform_pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # =============================================================================
  # MERGE CI IMAGE - Creates multi-arch manifest from per-arch builds
  # =============================================================================
  merge-ci:
    needs: [determine-params, build-ci]
    if: inputs.build_ci && inputs.image_name == 'leo-lang'
    runs-on: ubuntu-latest

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-ci-*
          merge-multiple: true

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.registry_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.determine-params.outputs.registry_image }}-ci
          tags: |
            type=raw,value=${{ inputs.project_version }}
            type=raw,value=latest,enable=${{ inputs.tag_latest }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ needs.determine-params.outputs.registry_image }}-ci@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ needs.determine-params.outputs.registry_image }}-ci:${{ inputs.project_version }}
