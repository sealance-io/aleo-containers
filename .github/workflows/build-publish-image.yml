name: Build and Publish Docker Images

# Reusable workflow - use manual-build.yml for workflow_dispatch
on:
  workflow_call:
    inputs:
      image_name:
        description: 'Name of the image to build (leo-lang or aleo-devnet)'
        required: true
        type: string
      dockerfile:
        description: 'Path to the Dockerfile'
        required: true
        type: string
      tag_latest:
        description: 'Tag as latest'
        required: false
        default: false
        type: boolean
      registry:
        description: 'Container registry'
        required: false
        default: 'ghcr.io'
        type: string
      organization:
        description: 'Organization in the registry'
        required: false
        default: 'sealance-io'
        type: string
      project_version:
        description: 'Project version/image tag to build (e.g., v4.1.0 or v4.1.0-v4.7.0)'
        required: true
        type: string
      leo_source_tag:
        description: 'Upstream Leo source tag for leo-lang builds (e.g., leo-lang-v4.1.0)'
        required: false
        default: ''
        type: string
      project_repo:
        description: 'Project repository URL'
        required: false
        type: string
      node_version:
        description: 'Node.js version for leo-lang'
        required: false
        default: '24'
        type: string
      debian_release:
        description: 'Debian release to use'
        required: false
        default: 'trixie'
        type: string
      snarkos_version:
        description: 'snarkOS version for aleo-devnet'
        required: false
        default: 'v4.8.1'
        type: string
      snarkos_source_tag:
        description: 'Upstream snarkOS source tag for aleo-devnet builds (e.g., testnet-v4.8.1; blank derives default)'
        required: false
        default: ''
        type: string
      rust_version:
        description: 'Rust version override (inferred from upstream if not set)'
        required: false
        default: ''
        type: string
      leo_version:
        description: 'Leo version for aleo-devnet (if different from project_version)'
        required: false
        default: 'v4.3.1'
        type: string
    secrets:
      registry_token:
        description: 'Token for container registry authentication'
        required: true

# No default permissions - jobs must explicitly request what they need
permissions: {}

jobs:
  determine-params:
    runs-on: ubuntu-latest
    permissions: {} # shell-only job, no token needed
    outputs:
      project_repo: ${{ steps.set-params.outputs.project_repo }}
      project_repo_arg: ${{ steps.set-params.outputs.project_repo_arg }}
      project_version_arg: ${{ steps.set-params.outputs.project_version_arg }}
      leo_source_tag: ${{ steps.set-params.outputs.leo_source_tag }}
      snarkos_source_tag: ${{ steps.set-params.outputs.snarkos_source_tag }}
      uses_target: ${{ steps.set-params.outputs.uses_target }}
      registry_image: ${{ steps.set-params.outputs.registry_image }}
      rust_version: ${{ steps.infer-rust.outputs.rust_version }}
    steps:
      - name: Set project-specific parameters
        id: set-params
        env:
          INPUT_REGISTRY: ${{ inputs.registry }}
          INPUT_ORGANIZATION: ${{ inputs.organization }}
          INPUT_IMAGE_NAME: ${{ inputs.image_name }}
          INPUT_PROJECT_REPO: ${{ inputs.project_repo }}
          INPUT_PROJECT_VERSION: ${{ inputs.project_version }}
          INPUT_LEO_SOURCE_TAG: ${{ inputs.leo_source_tag }}
          INPUT_SNARKOS_VERSION: ${{ inputs.snarkos_version }}
          INPUT_SNARKOS_SOURCE_TAG: ${{ inputs.snarkos_source_tag }}
        run: |
          REGISTRY_IMAGE="${INPUT_REGISTRY}/${INPUT_ORGANIZATION}/${INPUT_IMAGE_NAME}"
          echo "registry_image=${REGISTRY_IMAGE}" >> "$GITHUB_OUTPUT"

          if [[ "${INPUT_IMAGE_NAME}" == "leo-lang" ]]; then
            LEO_SOURCE_TAG="${INPUT_LEO_SOURCE_TAG}"
            if [[ -z "${LEO_SOURCE_TAG}" ]]; then
              if [[ "${INPUT_PROJECT_VERSION}" == "v4.1.0" ]]; then
                LEO_SOURCE_TAG="leo-lang-v4.1.0"
              elif [[ "${INPUT_PROJECT_VERSION}" == "v4.2.0" ]]; then
                LEO_SOURCE_TAG="leo-lang-v4.2.0"
              elif [[ "${INPUT_PROJECT_VERSION}" == "v4.3.0" ]]; then
                LEO_SOURCE_TAG="leo-lang-v4.3.0"
              elif [[ "${INPUT_PROJECT_VERSION}" == "v4.3.1" ]]; then
                LEO_SOURCE_TAG="leo-lang-v4.3.1"
              else
                LEO_SOURCE_TAG="${INPUT_PROJECT_VERSION}"
              fi
            fi
            {
              echo "project_repo_arg=LEO_REPO"
              echo "project_version_arg=LEO_VERSION"
              echo "project_repo=${INPUT_PROJECT_REPO:-https://github.com/ProvableHQ/leo}"
              echo "leo_source_tag=${LEO_SOURCE_TAG}"
              echo "snarkos_source_tag="
              echo "uses_target=true"
            } >> "$GITHUB_OUTPUT"
          elif [[ "${INPUT_IMAGE_NAME}" == "aleo-devnet" ]]; then
            # Image component stays normalized; the source tag drives clone/Rust inference.
            SNARKOS_SOURCE_TAG="${INPUT_SNARKOS_SOURCE_TAG}"
            if [[ -z "${SNARKOS_SOURCE_TAG}" ]]; then
              if [[ "${INPUT_SNARKOS_VERSION}" == "v4.8.1" ]]; then
                SNARKOS_SOURCE_TAG="testnet-v4.8.1"
              else
                SNARKOS_SOURCE_TAG="${INPUT_SNARKOS_VERSION}"
              fi
            fi
            {
              echo "project_version_arg=LEO_VERSION"
              echo "project_repo="
              echo "leo_source_tag="
              echo "snarkos_source_tag=${SNARKOS_SOURCE_TAG}"
              echo "uses_target=false"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unknown image name: ${INPUT_IMAGE_NAME}"
            exit 1
          fi

      - name: Infer Rust toolchain version
        id: infer-rust
        env:
          INPUT_RUST_VERSION: ${{ inputs.rust_version }}
          INPUT_IMAGE_NAME: ${{ inputs.image_name }}
          PROJECT_REPO: ${{ steps.set-params.outputs.project_repo }}
          LEO_SOURCE_TAG: ${{ steps.set-params.outputs.leo_source_tag }}
          SNARKOS_SOURCE_TAG: ${{ steps.set-params.outputs.snarkos_source_tag }}
          INPUT_PROJECT_VERSION: ${{ inputs.project_version }}
          INPUT_SNARKOS_VERSION: ${{ inputs.snarkos_version }}
        run: |
          if [[ -n "${INPUT_RUST_VERSION}" ]]; then
            echo "rust_version=${INPUT_RUST_VERSION}" >> "$GITHUB_OUTPUT"
            echo "Using explicitly provided Rust version: ${INPUT_RUST_VERSION}"
          else
            if [[ "${INPUT_IMAGE_NAME}" == "leo-lang" ]]; then
              REPO_PATH=$(echo "${PROJECT_REPO}" | sed -e 's|https://github.com/||' -e 's|\.git$||')
              TAG="${LEO_SOURCE_TAG}"
            elif [[ "${INPUT_IMAGE_NAME}" == "aleo-devnet" ]]; then
              REPO_PATH="ProvableHQ/snarkOS"
              TAG="${SNARKOS_SOURCE_TAG:-${INPUT_SNARKOS_VERSION:-v4.8.1}}"
            fi

            CHANNEL=$(curl -sSf --max-time 10 \
              "https://raw.githubusercontent.com/${REPO_PATH}/${TAG}/rust-toolchain.toml" 2>/dev/null \
              | sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
              | tr -d '[:space:]') || true

            if [[ "$CHANNEL" =~ ^[0-9]+\.[0-9]+$ ]]; then
              CHANNEL="${CHANNEL}.0"
            fi

            if [[ -n "$CHANNEL" && "$CHANNEL" != *nightly* ]]; then
              echo "rust_version=${CHANNEL}" >> "$GITHUB_OUTPUT"
              echo "Inferred Rust version: ${CHANNEL}"
            else
              if [[ "${INPUT_IMAGE_NAME}" == "aleo-devnet" ]]; then
                echo "rust_version=1.88.0" >> "$GITHUB_OUTPUT"
                echo "Could not infer Rust version, using default: 1.88.0"
              else
                echo "rust_version=1.96.0" >> "$GITHUB_OUTPUT"
                echo "Could not infer Rust version, using default: 1.96.0"
              fi
            fi
          fi

  # =============================================================================
  # STANDARD IMAGE BUILDS - Parallel per-architecture using native runners
  # =============================================================================
  build-standard: # zizmor: ignore[secrets-outside-env]
    needs: [determine-params]
    permissions:
      contents: read # checkout code
      packages: write # push images to registry
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04 # Doesn't use ubuntu-latest for consistency
            platform_pair: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm # There's no ubuntu-latest-arm alias
            platform_pair: linux-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.registry_token }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ needs.determine-params.outputs.registry_image }}
          tags: |
            type=raw,value=${{ inputs.project_version }}

      - name: Build and push by digest (Leo)
        if: inputs.image_name == 'leo-lang'
        id: build-leo
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          target: leo
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ needs.determine-params.outputs.project_version_arg }}=${{ inputs.project_version }}
            LEO_SOURCE_TAG=${{ needs.determine-params.outputs.leo_source_tag }}
            ${{ needs.determine-params.outputs.project_repo_arg }}=${{ needs.determine-params.outputs.project_repo }}
            RUST_VERSION=${{ needs.determine-params.outputs.rust_version }}
            NODE_VERSION=${{ inputs.node_version || '24' }}
            DEBIAN_RELEASE=${{ inputs.debian_release }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true,name=${{ needs.determine-params.outputs.registry_image }}
          cache-from: type=registry,ref=${{ needs.determine-params.outputs.registry_image }}:cache-${{ matrix.platform_pair }}
          cache-to: type=registry,ref=${{ needs.determine-params.outputs.registry_image }}:cache-${{ matrix.platform_pair }},mode=max

      - name: Build and push by digest (Aleo Devnet)
        if: inputs.image_name == 'aleo-devnet'
        id: build-devnet
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LEO_VERSION=${{ inputs.leo_version || 'v4.3.1' }}
            SNARKOS_VERSION=${{ inputs.snarkos_version || 'v4.8.1' }}
            SNARKOS_SOURCE_TAG=${{ needs.determine-params.outputs.snarkos_source_tag }}
            RUST_VERSION=${{ needs.determine-params.outputs.rust_version }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true,name=${{ needs.determine-params.outputs.registry_image }}
          cache-from: type=registry,ref=${{ needs.determine-params.outputs.registry_image }}:cache-${{ matrix.platform_pair }}
          cache-to: type=registry,ref=${{ needs.determine-params.outputs.registry_image }}:cache-${{ matrix.platform_pair }},mode=max

      - name: Export digest
        env:
          BUILD_DIGEST: ${{ steps.build-leo.outputs.digest || steps.build-devnet.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          # Get digest from whichever build step ran
          digest="${BUILD_DIGEST}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: digests-standard-${{ matrix.platform_pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # =============================================================================
  # MERGE STANDARD IMAGE - Creates multi-arch manifest from per-arch builds
  # =============================================================================
  merge-standard: # zizmor: ignore[secrets-outside-env]
    needs: [determine-params, build-standard]
    runs-on: ubuntu-latest
    permissions:
      packages: write # push manifest to registry

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-standard-*
          merge-multiple: true

      - name: Login to Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.registry_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ needs.determine-params.outputs.registry_image }}
          tags: |
            type=raw,value=${{ inputs.project_version }}
            type=raw,value=latest,enable=${{ inputs.tag_latest }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          REGISTRY_IMAGE: ${{ needs.determine-params.outputs.registry_image }}
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY_IMAGE}@sha256:%s " *)

      - name: Inspect image
        env:
          REGISTRY_IMAGE: ${{ needs.determine-params.outputs.registry_image }}
          PROJECT_VERSION: ${{ inputs.project_version }}
        run: |
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:${PROJECT_VERSION}"
