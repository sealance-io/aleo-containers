name: Security Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 1" # Every Monday at 00:00 UTC

# No default permissions - jobs must explicitly request what they need
permissions: {}

concurrency:
  # Include event_name so scheduled/manual full scans are never canceled by push-triggered runs
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect if workflow/Dockerfile files changed (skip for unrelated changes)
  # NOTE: This replaces workflow-level `paths` filter. Equivalent to:
  #   paths:
  #     - ".github/workflows/**"
  #     - ".github/zizmor.yml"
  #     - "*.Dockerfile"
  # Workflow-level path filters cause required status checks to remain "Pending"
  # forever when skipped, blocking PR merges. Job-level skipping via `if:` reports
  # "Success" for skipped jobs, allowing the security-status rollup to pass.
  detect-changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # checkout and diff
    outputs:
      workflows-changed: ${{ steps.changes.outputs.workflows }}
      dockerfiles-changed: ${{ steps.changes.outputs.dockerfiles }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check for workflow and Dockerfile changes
        id: changes
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_BASE_REF: ${{ github.base_ref }}
          GH_EVENT_BEFORE: ${{ github.event.before }}
          GH_EVENT_SHA: ${{ github.sha }}
        run: |
          # schedule/workflow_dispatch: always run everything
          if [[ "${GH_EVENT_NAME}" == "schedule" ]] || [[ "${GH_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "workflows=true" >> "$GITHUB_OUTPUT"
            echo "dockerfiles=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For push: compare against the "before" SHA to catch all commits in the push
          if [[ "${GH_EVENT_NAME}" == "push" ]]; then
            if git fetch origin "${GH_EVENT_BEFORE}" --depth=1 2>/dev/null; then
              CHANGED=$(git diff --name-only "${GH_EVENT_BEFORE}..${GH_EVENT_SHA}" 2>/dev/null || echo "")
            else
              CHANGED=""
            fi
          else
            # For pull_request: compare against base branch
            git fetch origin "${GH_BASE_REF}" --depth=1 2>/dev/null || true
            CHANGED=$(git diff --name-only "origin/${GH_BASE_REF}...HEAD" 2>/dev/null || echo "")
          fi

          # Default to true if detection fails
          if [[ -z "$CHANGED" ]]; then
            echo "workflows=true" >> "$GITHUB_OUTPUT"
            echo "dockerfiles=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check for workflow file changes
          if echo "$CHANGED" | grep -qE '^\.github/(workflows/|zizmor\.yml)'; then
            echo "workflows=true" >> "$GITHUB_OUTPUT"
          else
            echo "workflows=false" >> "$GITHUB_OUTPUT"
          fi

          # Check for Dockerfile changes
          if echo "$CHANGED" | grep -qE '\.Dockerfile$'; then
            echo "dockerfiles=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerfiles=false" >> "$GITHUB_OUTPUT"
          fi

  # ============================================================================
  # Workflow security audit (zizmor)
  # ============================================================================
  zizmor-audit:
    needs: detect-changes
    if: needs.detect-changes.outputs.workflows-changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout code for analysis
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run zizmor audit
        uses: zizmorcore/zizmor-action@71321a20a9ded102f6e9ce5718a2fcec2c4f70d8 # v0.5.2
        with:
          persona: ${{ github.event_name == 'schedule' && 'auditor' || 'pedantic' }}
          min-severity: medium
          advanced-security: false

  # ============================================================================
  # Dockerfile misconfiguration scan (Trivy config mode)
  # Runs on PR/push when Dockerfiles change. Fails on HIGH/CRITICAL.
  #
  # NOTE: Uses setup-trivy (binary-only install) instead of trivy-action.
  # The trivy-action tags were mass-repointed to malicious commits in the
  # March 2026 supply chain attack. setup-trivy was not affected.
  # ============================================================================
  trivy-dockerfile-scan:
    needs: detect-changes
    if: needs.detect-changes.outputs.dockerfiles-changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout code for scanning
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - leo.Dockerfile
          - aleo-devnet.Dockerfile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          cache: true

      - name: Run Trivy config scan
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table \
            "${DOCKERFILE}"

  # ============================================================================
  # Published image vulnerability scan (Trivy image mode)
  # Runs on schedule/manual only. Report-only (exit-code 0) — upstream CVEs
  # may not be immediately fixable.
  # ============================================================================
  trivy-image-scan:
    needs: detect-changes
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # setup-trivy cache restore
      packages: read # pull images from GHCR
    strategy:
      fail-fast: false
      matrix:
        image:
          - ghcr.io/sealance-io/leo-lang:latest
          - ghcr.io/sealance-io/aleo-devnet:latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          cache: true

      - name: Run Trivy image scan
        env:
          IMAGE_REF: ${{ matrix.image }}
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format table \
            --scanners vuln \
            "${IMAGE_REF}"

  # ============================================================================
  # Published image vulnerability scan (Grype)
  # Second scanner for vulnerability database diversity. Report-only.
  # ============================================================================
  grype-image-scan:
    needs: detect-changes
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # scan-action workspace context
      packages: read # pull images from GHCR
    strategy:
      fail-fast: false
      matrix:
        image:
          - ghcr.io/sealance-io/leo-lang:latest
          - ghcr.io/sealance-io/aleo-devnet:latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Grype image scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ matrix.image }}
          severity-cutoff: high
          fail-build: "false"
          output-format: table

  # ============================================================================
  # Security status aggregation for branch protection
  # ============================================================================
  security-status:
    if: always()
    needs: [detect-changes, zizmor-audit, trivy-dockerfile-scan, trivy-image-scan, grype-image-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {} # just checks job results
    steps:
      - name: Check security audit status
        env:
          NEEDS_DETECT_CHANGES_RESULT: ${{ needs.detect-changes.result }}
          NEEDS_ZIZMOR_AUDIT_RESULT: ${{ needs.zizmor-audit.result }}
          NEEDS_TRIVY_DOCKERFILE_RESULT: ${{ needs.trivy-dockerfile-scan.result }}
          NEEDS_TRIVY_IMAGE_RESULT: ${{ needs.trivy-image-scan.result }}
          NEEDS_GRYPE_IMAGE_RESULT: ${{ needs.grype-image-scan.result }}
        run: |
          # detect-changes must succeed
          if [[ "${NEEDS_DETECT_CHANGES_RESULT}" != "success" ]]; then
            echo "detect-changes failed: ${NEEDS_DETECT_CHANGES_RESULT}"
            exit 1
          fi

          # All other jobs can be skipped or must succeed
          results=(
            "zizmor-audit:${NEEDS_ZIZMOR_AUDIT_RESULT}"
            "trivy-dockerfile-scan:${NEEDS_TRIVY_DOCKERFILE_RESULT}"
            "trivy-image-scan:${NEEDS_TRIVY_IMAGE_RESULT}"
            "grype-image-scan:${NEEDS_GRYPE_IMAGE_RESULT}"
          )

          for result in "${results[@]}"; do
            job="${result%%:*}"
            status="${result##*:}"
            echo "$job: $status"
            if [[ "$status" != "success" ]] && [[ "$status" != "skipped" ]]; then
              echo "Security audit failed: $job"
              exit 1
            fi
          done

          echo ""
          echo "Security audit passed"
